[package]
name = "kivi-desktop"
version = "0.1.0"
description = "KiVi — KiCad viewer and hardware review for GitHub, as a desktop app"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "kivi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Device-flow sign-in and git over HTTPS (git_http.rs); rustls so no OpenSSL
# development package is needed. "blocking": git operations run on their own thread.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Clone, branch, commit, push: libgit2 built in (no Git installation needed, e.g.
# for the plain Windows .exe). No "https"/"ssh" features: HTTPS goes through
# reqwest (git_http.rs) instead of OpenSSL.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
notify = "6"
notify-debouncer-mini = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
