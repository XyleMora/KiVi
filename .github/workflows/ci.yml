# Tests on every pull request; tests and the Linux build on every push to
# main; a Windows build and a GitHub Release with the AppImage and the
# Windows .exe for every tag v<version> (matching "version" in
# src-tauri/tauri.conf.json).
# Running the workflow by hand (workflow_dispatch) also builds for Windows.
#
# Optional repository variables (Settings → Secrets and variables → Actions →
# Variables), baked into the build so the sign-in dialog doesn't ask for them:
#   KIVI_GITHUB_CLIENT_ID   the GitHub App's Client ID (Iv23…)
#   KIVI_GITHUB_APP_SLUG    its URL name (github.com/apps/<slug>)

name: CI

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install gjs, WebKitGTK and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs gir1.2-webkit2-4.1 gir1.2-gtk-3.0 xvfb xauth

      # KiCad's demo files (tests/kicad-demos.txt): downloaded once, then
      # restored from the cache until the list changes.
      - name: Cache KiCad demo files
        uses: actions/cache@v4
        with:
          path: tests/kicad-demos
          key: kicad-demos-${{ hashFiles('tests/kicad-demos.txt') }}

      - name: Fetch KiCad demo files
        run: python3 tools/fetch_demos.py

      - name: Unit tests
        run: |
          gjs -m tests/models.js
          gjs -m tests/review.js
          gjs -m tests/diff.js
          gjs -m tests/nets.js

      - name: Parse and render all KiCad demos
        run: gjs -m tests/run.js

      - name: Smoke test the pages (headless WebKit)
        run: tests/smoke.sh

  # The Rust side's unit tests (src-tauri/src/lib.rs: model folder access).
  # A debug build, separate from the release build below, so it runs on pull
  # requests too.
  rust-test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context!() embeds the pages, so dist/web must exist to compile.
      - name: Copy the pages to dist/web
        run: python3 tools/build_web.py

      - name: cargo test
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

  # Not for pull requests: they only run the tests.
  build:
    name: Build (Linux)
    needs: [test, rust-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev build-essential patchelf file

      - uses: dtolnay/rust-toolchain@stable

      # Caches the build and ~/.cargo/bin (so tauri-cli is compiled once).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Build the AppImage
        env:
          KIVI_GITHUB_CLIENT_ID: ${{ vars.KIVI_GITHUB_CLIENT_ID }}
          KIVI_GITHUB_APP_SLUG: ${{ vars.KIVI_GITHUB_APP_SLUG }}
          APPIMAGE_EXTRACT_AND_RUN: "1" # the AppImage tooling runs without FUSE
        run: cargo tauri build

      # The bundled notices must match Cargo.lock and vendor/.
      - name: Check THIRD-PARTY-NOTICES.md is up to date
        run: python3 tools/notices.py --check

      # The AppImage carries this runner's GTK/WebKitGTK libraries; their
      # licences and sources are published next to it.
      - name: List the AppImage's system libraries
        run: python3 tools/notices.py --appdir src-tauri/target/release/bundle/appimage/KiVi.AppDir src-tauri/target/release/bundle/appimage/appimage-libraries.md

      - uses: actions/upload-artifact@v4
        with:
          name: kivi-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/appimage-libraries.md
          if-no-files-found: error

  # Only for releases: a Windows runner is slower and the tests above already
  # cover the shared code. Tauri merges src-tauri/tauri.windows.conf.json
  # (`python` instead of `python3`). No installer and no zip: like the
  # AppImage, the release is one file to download and run. The pages are built
  # into the .exe; it needs the WebView2 runtime (part of Windows 11, and of
  # Windows 10 through Edge updates).
  build-windows:
    name: Build (Windows)
    needs: [test, rust-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the app
        env:
          KIVI_GITHUB_CLIENT_ID: ${{ vars.KIVI_GITHUB_CLIENT_ID }}
          KIVI_GITHUB_APP_SLUG: ${{ vars.KIVI_GITHUB_APP_SLUG }}
        run: cargo tauri build --no-bundle

      - name: Name the .exe after the version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/kivi-desktop.exe "KiVi_${version}_x64.exe"

      # The licences go next to the .exe (and so into the release): the
      # AppImage carries them inside, a bare .exe can't.
      - uses: actions/upload-artifact@v4
        with:
          name: kivi-windows
          path: |
            KiVi_*_x64.exe
            LICENSE
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  release:
    name: Release
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Every artifact (kivi-linux, kivi-windows), each in its own folder.
      - uses: actions/download-artifact@v4
        with:
          path: bundles

      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
