# Tests on every pull request and push to main; the Linux, Windows and macOS builds
# and a GitHub Release with the AppImage, the Windows .exe, the macOS .dmg and a source archive for every tag
# v<version> (the version comes from the tag: tools/set_version.py writes it in). Running the
# workflow by hand (workflow_dispatch) builds all three without releasing: do that
# before tagging, since merges no longer build.
#
# Optional repository variables (Settings → Secrets and variables → Actions →
# Variables), baked into the build so the sign-in dialog doesn't ask for them:
#   KIVI_GITHUB_CLIENT_ID   the GitHub App's Client ID (Iv23…)
#   KIVI_GITHUB_APP_SLUG    its URL name (github.com/apps/<slug>)
#   KIVI_GITLAB_CLIENT_ID   the gitlab.com OAuth application's ID (device flow)
#   KIVI_UPDATER_PUBKEY     the public half of the update signing key (the .pub file
#                           from `cargo tauri signer generate`); without it the build
#                           has in-app updates off
#   KIVI_UPDATE_REPO        owner/repo whose releases the app follows (default XyleMora/KiVi)
# and these repository secrets, to sign the update files (without them the release
# has no latest.json, so no updates):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD

name: CI

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One exact version for every job. With a range ("^2"), `cargo install` keeps
  # whatever older 2.x rust-cache restored into ~/.cargo/bin, and the update
  # signing needs a CLI that puts the version into the signature (--app-version,
  # 2.12.3 is the one tested). Raise it here, and in README.md, on purpose.
  TAURI_CLI_VERSION: "2.12.3"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install gjs, WebKitGTK and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs gir1.2-webkit2-4.1 gir1.2-gtk-3.0 xvfb xauth

      # KiCad's demo files (tests/kicad-demos.txt): downloaded once, then
      # restored from the cache until the list changes.
      - name: Cache KiCad demo files
        uses: actions/cache@v4
        with:
          path: tests/kicad-demos
          key: kicad-demos-${{ hashFiles('tests/kicad-demos.txt') }}

      - name: Fetch KiCad demo files
        run: python3 tools/fetch_demos.py

      - name: Unit tests
        run: |
          gjs -m tests/models.js
          gjs -m tests/review.js
          gjs -m tests/gitlab.js
          gjs -m tests/diff.js
          gjs -m tests/nets.js
          gjs -m tests/updates.js
          python3 -m unittest tests/test_update_manifest.py

      - name: Parse and render all KiCad demos
        run: gjs -m tests/run.js

      - name: Smoke test the pages (headless WebKit)
        run: tests/smoke.sh

  # The Rust side's unit tests (src-tauri/src/lib.rs: model folder access).
  # A debug build, separate from the release build below, so it runs on pull
  # requests too.
  rust-test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context!() embeds the pages, so dist/web must exist to compile.
      - name: Copy the pages to dist/web
        run: python3 tools/build_web.py

      - name: cargo test
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

      # The bundled notices must match Cargo.lock and vendor/ (needs only
      # cargo metadata, so it runs here, before merging, not in the build).
      - name: Check THIRD-PARTY-NOTICES.md is up to date
        run: python3 tools/notices.py --check

  # Only for releases and manual runs, like the Windows build: the tests above
  # cover the code on every change, and a release build takes 10-20 minutes.
  build:
    name: Build (Linux)
    needs: [test, rust-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # The oldest Ubuntu LTS still in standard support, not the newest: the AppImage
    # bundles GTK/WebKitGTK but uses the system's glibc, so it only runs on systems
    # with a glibc at least as new as the build machine's (22.04: 2.35). Built on
    # 24.04 (2.39), v0.2.0 failed on 22.04, Debian 12 and the AppImage catalog's
    # test (AppImage/appimage.github.io#11608). Move on when 22.04 leaves standard
    # support (April 2027) and the runner image is retired.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev build-essential patchelf file

      - uses: dtolnay/rust-toolchain@stable

      # Caches the build and ~/.cargo/bin (so tauri-cli is compiled once).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # A release's version is its tag's (v0.2.0 → 0.2.0), written into
      # tauri.conf.json, Cargo.toml and Cargo.lock before building: nothing to
      # bump by hand. A tag that isn't v<major>.<minor>.<patch> fails here.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/set_version.py "$GITHUB_REF_NAME"

      - name: Build the AppImage
        env:
          KIVI_GITHUB_CLIENT_ID: ${{ vars.KIVI_GITHUB_CLIENT_ID }}
          KIVI_GITHUB_APP_SLUG: ${{ vars.KIVI_GITHUB_APP_SLUG }}
          KIVI_GITLAB_CLIENT_ID: ${{ vars.KIVI_GITLAB_CLIENT_ID }}
          KIVI_UPDATE_REPO: ${{ vars.KIVI_UPDATE_REPO }}
          KIVI_UPDATER_PUBKEY: ${{ vars.KIVI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1" # the AppImage tooling runs without FUSE
        run: |
          # Update files (.sig next to each) only when the signing key is set, so
          # builds without it (forks, local) still work. The tauri CLI reads the public
          # key from the config, so it's handed over here instead of kept in the file.
          args=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$KIVI_UPDATER_PUBKEY" ]; then
            args+=(--config "$(python3 tools/updater_config.py)")
          fi
          cargo tauri build ${args[@]+"${args[@]}"}

      # The AppImage carries this runner's GTK/WebKitGTK libraries; their
      # licences and sources are published next to it.
      # Fails the build if anything in the AppImage needs a newer glibc than this
      # runner's (a library picked up from elsewhere, or a later runner bump).
      - name: Check the AppImage's glibc requirement
        run: python3 tools/check_glibc.py src-tauri/target/release/bundle/appimage/KiVi.AppDir

      - name: List the AppImage's system libraries
        run: python3 tools/notices.py --appdir src-tauri/target/release/bundle/appimage/KiVi.AppDir src-tauri/target/release/bundle/appimage/appimage-libraries.md

      - uses: actions/upload-artifact@v4
        with:
          name: kivi-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/appimage-libraries.md
          if-no-files-found: error

  # Only for releases and manual runs: a Windows runner is slower and the
  # tests above already cover the shared code. Tauri merges src-tauri/tauri.windows.conf.json
  # (`python` instead of `python3`). No installer and no zip: like the
  # AppImage, the release is one file to download and run. The pages are built
  # into the .exe; it needs the WebView2 runtime (part of Windows 11, and of
  # Windows 10 through Edge updates).
  build-windows:
    name: Build (Windows)
    needs: [test, rust-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python tools/set_version.py "$GITHUB_REF_NAME"

      - name: Build the app
        env:
          KIVI_GITHUB_CLIENT_ID: ${{ vars.KIVI_GITHUB_CLIENT_ID }}
          KIVI_GITHUB_APP_SLUG: ${{ vars.KIVI_GITHUB_APP_SLUG }}
          KIVI_GITLAB_CLIENT_ID: ${{ vars.KIVI_GITLAB_CLIENT_ID }}
          KIVI_UPDATE_REPO: ${{ vars.KIVI_UPDATE_REPO }}
          KIVI_UPDATER_PUBKEY: ${{ vars.KIVI_UPDATER_PUBKEY }}
        run: cargo tauri build --no-bundle

      - name: Name the .exe after the version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/kivi-desktop.exe "KiVi_${version}_x64.exe"

      # The in-app updater downloads this very file and checks its signature, so it
      # is signed here (no installer: Tauri's updater artifacts are for those).
      # --app-version binds the signature to the version, which the app requires.
      # Skipped without the key (key and password come from the environment).
      - name: Sign the .exe for in-app updates
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Host "No signing key: not signing for updates"; exit 0 }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          cargo tauri signer sign --app-version $version "KiVi_${version}_x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The licences go next to the .exe (and so into the release): the
      # AppImage carries them inside, a bare .exe can't.
      - uses: actions/upload-artifact@v4
        with:
          name: kivi-windows
          path: |
            KiVi_*_x64.exe
            KiVi_*_x64.exe.sig
            LICENSE
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  # Only for releases and manual runs, like the other builds. One universal
  # .dmg (Apple Silicon and Intel) from src-tauri/tauri.macos.conf.json, which
  # Tauri merges on macOS. Not code-signed or notarised (that needs an Apple
  # Developer account): the linker's ad-hoc signature is enough to run, and
  # Gatekeeper asks once (System Settings → Privacy & Security → Open Anyway).
  # CI=true (set by Actions) skips the Finder window styling in Tauri's
  # bundle_dmg.sh, which can leave the disk image busy. LICENSE and
  # THIRD-PARTY-NOTICES.md are inside the .app, like the AppImage.
  build-macos:
    name: Build (macOS)
    needs: [test, rust-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/set_version.py "$GITHUB_REF_NAME"

      - name: Build the .dmg
        env:
          KIVI_GITHUB_CLIENT_ID: ${{ vars.KIVI_GITHUB_CLIENT_ID }}
          KIVI_GITHUB_APP_SLUG: ${{ vars.KIVI_GITHUB_APP_SLUG }}
          KIVI_GITLAB_CLIENT_ID: ${{ vars.KIVI_GITLAB_CLIENT_ID }}
          KIVI_UPDATE_REPO: ${{ vars.KIVI_UPDATE_REPO }}
          KIVI_UPDATER_PUBKEY: ${{ vars.KIVI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # With the signing key set, also build the .app and its signed
          # KiVi.app.tar.gz, which the in-app updater downloads (a .dmg alone
          # makes no updater file). Without it: the .dmg only, as before.
          args=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$KIVI_UPDATER_PUBKEY" ]; then
            args+=(--bundles app,dmg --config "$(python3 tools/updater_config.py)")
          fi
          cargo tauri build --target universal-apple-darwin ${args[@]+"${args[@]}"}

      # The updater file is named like the .dmg (version and arch) so it can sit
      # in the release next to it.
      - name: Name the updater files after the version
        run: |
          macos=src-tauri/target/universal-apple-darwin/release/bundle/macos
          if [ -f "$macos/KiVi.app.tar.gz.sig" ]; then
            version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
            cp "$macos/KiVi.app.tar.gz" "$macos/KiVi_${version}_universal.app.tar.gz"
            cp "$macos/KiVi.app.tar.gz.sig" "$macos/KiVi_${version}_universal.app.tar.gz.sig"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kivi-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/KiVi_*_universal.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/KiVi_*_universal.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: Release
    needs: [build, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Every artifact (kivi-linux, kivi-windows, kivi-macos), each in its own folder.
      - uses: actions/download-artifact@v4
        with:
          path: bundles

      # The tagged source next to the binaries: the GPL asks for it, and the
      # LGPL of occt-import-js (patched, built into the app) needs it to rebuild
      # KiVi with another version. Unlike GitHub's "Source code" links (only
      # for people who can see the repository), it's a file that goes wherever
      # the binaries are copied.
      - uses: actions/checkout@v4
        with:
          path: src
      # With the tag's version written in, like the binaries: `git stash create`
      # makes a commit of the tagged tree plus that change, without touching
      # any branch, and the archive is made from it.
      - name: Source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 src/tools/set_version.py "$GITHUB_REF_NAME"
          tree=$(git -C src -c user.name=KiVi -c user.email=ci@localhost stash create)
          mkdir -p bundles/source
          git -C src archive --format=tar.gz --prefix="KiVi-${version}/" \
            -o "$PWD/bundles/source/KiVi_${version}_source.tar.gz" "${tree:-HEAD}"

      # The updater's feed (latest.json) from the signed files; nothing is written
      # (and the release has no updates) when no signing key was set. The
      # signatures are only read here, not published.
      - name: Updater feed
        run: |
          python3 src/tools/update_manifest.py bundles "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          find bundles -name '*.sig' -delete

      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
          # A tag with a suffix (v0.2.1-macos1) is a pre-release, which
          # releases/latest, and so the in-app updater, skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
